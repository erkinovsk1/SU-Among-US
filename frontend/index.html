<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPACE CREW — Лобби</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars"></div>

  <main class="app">
    <header class="brand">
      <div class="badge">SECTOR 09 • PRE-FLIGHT</div>
      <h1>SPACE CREW</h1>
      <p class="subtitle">Собери экипаж, проверь код доступа и приготовься к вылету</p>
    </header>

    <section id="menuScreen" class="card">
      <div class="field">
        <label for="nicknameInput">Позывной (никнейм)</label>
        <input
          id="nicknameInput"
          type="text"
          maxlength="16"
          placeholder="Например, RedVanguard"
          autocomplete="off"
        />
      </div>

      <div class="field">
        <label>Цвет скафандра</label>
        <div id="colorPicker" class="colors"></div>
      </div>

      <button id="createBtn" class="btn btn-primary">Создать лобби</button>

      <div class="divider"><span>или войти по коду</span></div>

      <div class="join-row">
        <input
          id="roomCodeInput"
          type="text"
          maxlength="6"
          placeholder="КОД (А7К2)"
          autocomplete="off"
        />
        <button id="joinBtn" class="btn btn-secondary">Войти</button>
      </div>

      <div id="errorBox" class="error" role="alert"></div>
    </section>

    <section id="lobbyScreen" class="card hidden">
      <div class="lobby-top">
        <div>
          <span class="label-muted">КОД КОМНАТЫ</span>
          <div class="code-row">
            <strong id="currentCode" class="room-code">----</strong>
            <button id="copyCodeBtn" class="btn-chip" type="button">Копировать</button>
          </div>
        </div>
        <button id="leaveBtn" class="btn btn-ghost" type="button">Выйти</button>
      </div>

      <p id="hostBadge" class="status-pill"></p>

      <div class="players-header">
        <span>Экипаж</span>
        <span id="playersCount">0 / 10</span>
      </div>

      <ul id="playersList" class="players-list"></ul>

      <button id="startBtn" class="btn btn-primary hidden" type="button">
        Начать миссию
      </button>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
