<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Тест лобби</title>
  <style>
    body {
      font-family: sans-serif;
      background: #121520;
      color: #f3f4f6;
      max-width: 460px;
      margin: 40px auto;
      padding: 0 16px;
    }
    input, button {
      padding: 8px 12px;
      margin: 6px 0;
      font-size: 15px;
    }
    button {
      cursor: pointer;
    }
    .box {
      background: #1e2436;
      padding: 16px;
      border-radius: 8px;
      margin-top: 12px;
    }
    .error {
      color: #ff6b6b;
      min-height: 20px;
      margin-top: 8px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h2>Тест главного экрана и лобби</h2>

  <div id="menuScreen" class="box">
    <div>
      <label>Никнейм:</label><br />
      <input id="nicknameInput" type="text" placeholder="Например, Alikhan" />
    </div>

    <button id="createBtn">Создать лобби</button>

    <hr />

    <div>
      <label>Код лобби:</label><br />
      <input id="roomCodeInput" type="text" placeholder="Например, A7K2" maxlength="6" />
      <button id="joinBtn">Войти по коду</button>
    </div>

    <div id="errorBox" class="error"></div>
  </div>

  <div id="lobbyScreen" class="box hidden">
    <h3>Комната: <span id="currentCode"></span></h3>
    <p id="hostBadge"></p>
    <h4>Игроки в лобби:</h4>
    <ul id="playersList"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const menuScreen = document.getElementById('menuScreen');
    const lobbyScreen = document.getElementById('lobbyScreen');
    const nicknameInput = document.getElementById('nicknameInput');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const createBtn = document.getElementById('createBtn');
    const joinBtn = document.getElementById('joinBtn');
    const errorBox = document.getElementById('errorBox');
    const currentCode = document.getElementById('currentCode');
    const hostBadge = document.getElementById('hostBadge');
    const playersList = document.getElementById('playersList');

    function showError(msg) {
      errorBox.textContent = msg || '';
    }

    function renderPlayers(players) {
      playersList.innerHTML = '';
      players.forEach((p) => {
        const li = document.createElement('li');
        li.textContent = p.nickname;
        playersList.appendChild(li);
      });
    }

    function enterLobby({ roomCode, players, isHost }) {
      showError('');
      menuScreen.classList.add('hidden');
      lobbyScreen.classList.remove('hidden');
      currentCode.textContent = roomCode;
      hostBadge.textContent = isHost ? 'Вы хост комнаты' : 'Вы участник комнаты';
      renderPlayers(players);
    }

    createBtn.addEventListener('click', () => {
      socket.emit('create_lobby', { nickname: nicknameInput.value });
    });

    joinBtn.addEventListener('click', () => {
      socket.emit('join_lobby', {
        nickname: nicknameInput.value,
        roomCode: roomCodeInput.value
      });
    });

    socket.on('lobby_joined', enterLobby);
    socket.on('update_players', renderPlayers);
    socket.on('host_changed', ({ isHost }) => {
      if (isHost) hostBadge.textContent = 'Вы хост комнаты';
    });
    socket.on('error_message', showError);
  </script>
</body>
</html>
